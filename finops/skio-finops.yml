description: >-
  FinOps view of Skio spend. Skio is a SaaS subscription-management platform for
  Shopify DTC brands, billed as a flat monthly platform fee (Scale plan) plus a
  per-order transaction fee (1% + $0.20) on each subscription order, with a
  custom Enterprise tier for high-volume merchants. The dominant, variable cost
  driver is the transaction fee, which scales directly with subscription order
  volume and average order value. The GraphQL API carries no separate fee - it is
  included with the plan - so API usage does not add a line item beyond the
  platform and transaction fees.
notes: >-
  Rates captured 2026-07 from skio.com/pricing; not reconciled. Skio was acquired
  by Recharge in 2026 - verify plan names and rates during reconciliation. The
  1% + $0.20 transaction fee is charged per subscription order on top of the
  monthly platform fee.
