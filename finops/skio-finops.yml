meters:
- name: platform_fee
  description: Flat monthly platform subscription fee for the Skio plan.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: subscription_orders
  description: Per-order transaction fee (1% + $0.20) charged on each subscription order processed through Skio.
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - shop
- name: subscription_revenue
  description: Gross subscription revenue processed, the base against which the 1% transaction component is assessed.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - shop
principles:
- name: Visibility
  description: Track subscription order count and gross subscription revenue per shop; the 1% + $0.20 transaction fee scales directly with both.
- name: Allocation
  description: Map platform and transaction fees to each Shopify store / brand and to the subscription program that generates them.
- name: Optimization
  description: Reduce churn and consolidate low-value orders (bundling, longer intervals) to improve the ratio of subscription revenue to per-order fees; compare Scale annual vs monthly billing.
- name: Accountability
  description: Assign an owner for the subscription P&L; review monthly platform + transaction fees against subscription revenue and LTV gains.
