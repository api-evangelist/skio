  description: Query and manage recurring subscriptions - list and fetch subscriptions
    and their lines, then create, cancel, pause, unpause, reactivate, skip, ship now,
    swap product variants, edit interval, apply discount codes, and update the next
    billing date. Mirrors Shopify's SubscriptionContract via platformId.
- aid: skio:skio-subscribers-api
