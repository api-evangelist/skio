    type: Documentation
  - url: https://code.skio.com/
    type: APIReference
  - url: graphql/skio-schema.graphql
    type: GraphQL
  description: Look up storefront users (subscribers) and their addresses and payment
    methods, filter by email, and generate passwordless magic links and quick-action
    tokens for self-service subscriber portals. StorefrontUser mirrors Shopify's
    Customer object.
