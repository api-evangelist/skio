name: Skio
kind: company
description: Skio is a subscription-management platform for Shopify DTC brands
  (acquired by Recharge in 2026), powering recurring orders, passwordless
  subscriber portals, and one-click Shop Pay checkout. Its public developer API
  is GraphQL-first, served from https://graphql.skio.com/v1/graphql, with a data
  model that mirrors Shopify GraphQL objects - most entities carry a platformId
  holding the corresponding Shopify GID. Read queries use Hasura-style
  where/order_by/limit/offset arguments; writes are purpose-built mutations
  (createSubscription, cancelSubscription, pauseSubscription, applyDiscountCode).
  A newer public REST API has also been announced.
